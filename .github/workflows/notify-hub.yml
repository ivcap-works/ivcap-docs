# .github/workflows/notify-hub.yml
#
# TEMPLATE — copy this file to each downstream SDK or example repo.
# On release it pings the hub (ivcap-works/ivcap-docs) to trigger a
# targeted rebuild of only the changed SDK/example docs.
#
# This file lives here as a reference only.  The push trigger is intentionally
# absent so it does NOT run inside the hub repo itself (which would call itself
# and fail).
#
# Requirements (in the downstream repo):
#   - Create a repo secret HUB_DISPATCH_TOKEN with a PAT that has
#     `repo` scope on the hub repo (or a fine-grained token with
#     Contents: Read & Write on ivcap-works/ivcap-docs only).
#   - Set REGISTRY_SLUG and DISPATCH_TYPE for each repo.

name: Notify Hub

on:
  release:
    types: [published]
  # NOTE: do NOT add a push trigger here when this file is in the hub repo.
  # For downstream repos, you may add:
  #   push:
  #     branches: [main]
  #     paths:
  #       - "docs/**"

env:
  HUB_REPO: "ivcap-works/ivcap-docs"
  # For SDK repos: set to the SDK's slug in sdk-registry.json
  # For example repos: set to the example's slug in example-registry.json
  REGISTRY_SLUG: "python" # ← change per repo
  DISPATCH_TYPE: "sdk-updated" # ← use "example-updated" for example repos

jobs:
  notify-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hub rebuild
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HUB_DISPATCH_TOKEN || github.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "${{ env.HUB_REPO }}".split("/")[0],
              repo:  "${{ env.HUB_REPO }}".split("/")[1],
              event_type: "${{ env.DISPATCH_TYPE }}",
              client_payload: {
                sdk:     "${{ env.REGISTRY_SLUG }}",
                example: "${{ env.REGISTRY_SLUG }}",
                source_repo: context.repo.repo,
                ref: context.ref,
              },
            });
            console.log("Hub rebuild triggered for: ${{ env.REGISTRY_SLUG }}");
